[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "provecode"
version = "0.2.1"
description = "Detects semantic, count-preserving test weakening in Python changes and ties each finding to an approved contract condition."
requires-python = ">=3.11"
license = "MIT"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/Shriram28Baskar/provecode"
Changelog = "https://github.com/Shriram28Baskar/provecode/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cli = ["PyYAML>=6"]
dev = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
provecode = "provecode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "PIE", "C4", "RUF"]
ignore = ["SIM108"]  # nested ternaries read worse than an explicit if/else

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/provecode"]
