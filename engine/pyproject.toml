[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provecode"
version = "0.1.0"
description = "Detects semantic, count-preserving test weakening in Python changes and ties each finding to an approved contract condition."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
cli = ["PyYAML>=6"]
dev = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
provecode = "provecode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
